# Tool configuration for the series (this folder is not an installable package).

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/W: style (pycodestyle), F: errors (pyflakes), B: likely bugs (bugbear), UP: modern syntax
select = ["E", "F", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
